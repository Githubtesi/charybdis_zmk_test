include:
  # QWERTY BT (Bluetooth / ワイヤレス版)
  - board: nice_nano_v2
    shield: charybdis_left
    keymap: qwerty
    format: bt
    artifact-name: charybdis_qwerty_left

  - board: nice_nano_v2
    shield: charybdis_right
    keymap: qwerty
    format: bt
    artifact-name: charybdis_qwerty_right
    snippet: studio-rpc-usb-uart

  # GPIO 022 row-position diagnostics
  - board: nice_nano_v2
    shield: charybdis_right_r0
    keymap: qwerty
    format: bt
    artifact-name: right_gpio022_row0

  - board: nice_nano_v2
    shield: charybdis_right_r1
    keymap: qwerty
    format: bt
    artifact-name: right_gpio022_row1

  - board: nice_nano_v2
    shield: charybdis_right_r2
    keymap: qwerty
    format: bt
    artifact-name: right_gpio022_row2

  - board: nice_nano_v2
    shield: charybdis_right_r3
    keymap: qwerty
    format: bt
    artifact-name: right_gpio022_row3

  - board: nice_nano_v2
    shield: charybdis_right_r4
    keymap: qwerty
    format: bt
    artifact-name: right_gpio022_row4

  # Firmware Reset (設定リセット用)
  - board: nice_nano_v2
    shield: settings_reset
    format: reset
    artifact-name: firmware_reset_nano_v2
